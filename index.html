<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>교육서비스업 공간분석 스토리맵</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      line-height: 1.7;
      color: #222;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 30px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 60px;
      font-size: 28px;
    }

    #map {
      width: 100%;
      height: 600px;
      margin-top: 30px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="content">

    <h1>교육서비스업 공간분석 스토리맵</h1>

    <p>
      우리가 흔히 교육의 중심지라고 생각하는 서울 강남구 대치동.
      그런데 SGIS 데이터를 살펴보면 예상 밖의 지역이 등장합니다.
    </p>

    <p>
      경상남도 양산시 물금읍과 서울특별시 강남구 대치4동의
      교육서비스업과 공간적 특성을 비교해보겠습니다.
    </p>


    <h2>두 지역은 어디에 있을까?</h2>

    <p>
      먼저 물금읍과 대치4동의 위치를 지도에서 살펴보겠습니다.
      지도를 직접 확대하거나 이동할 수 있습니다.
    </p>

    <div id="map"></div>

  </div>


  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    // 대한민국 중심 부근에서 지도 시작
    const map = L.map('map').setView([36.3, 127.8], 7);

    // OpenStreetMap 배경지도
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    // 물금읍 위치
    const mulgeum = L.marker([35.31, 129.01])
      .addTo(map)
      .bindPopup('<b>경상남도 양산시 물금읍</b>');


    // 대치4동 위치
    const daechi = L.marker([37.50, 127.06])
      .addTo(map)
      .bindPopup('<b>서울특별시 강남구 대치4동</b>');

  </script>

</body>
</html>

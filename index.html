<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>교육서비스업 공간분석 스토리맵</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

  <style>
    body {
      margin: 0;
      font-family: "Noto Sans KR", Arial, sans-serif;
      line-height: 1.7;
      color: #222;
    }

    .content {
      max-width: 900px;
      margin: 0 auto;
      padding: 60px 30px;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 20px;
    }

    h2 {
      margin-top: 60px;
      font-size: 28px;
    }

    #map {
      width: 100%;
      height: 600px;
      margin-top: 30px;
      border-radius: 10px;
    }
  </style>
</head>

<body>

  <div class="content">

    <h1>교육서비스업 공간분석 스토리맵</h1>

    <p>
      우리가 흔히 교육의 중심지라고 생각하는 서울 강남구 대치동.
      그런데 SGIS 데이터를 살펴보면 예상 밖의 지역이 등장합니다.
    </p>

    <p>
      경상남도 양산시 물금읍과 서울특별시 강남구 대치4동의
      교육서비스업과 공간적 특성을 비교해보겠습니다.
    </p>


    <h2>두 지역은 어디에 있을까?</h2>

    <p>
      먼저 물금읍과 대치4동의 위치를 지도에서 살펴보겠습니다.
      지도를 직접 확대하거나 이동할 수 있습니다.
    </p>

    <div id="map"></div>

  </div>


  <!-- Leaflet JavaScript -->
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
  </script>

  <script>

    // 대한민국 중심 부근에서 지도 시작
    const map = L.map('map').setView([36.3, 127.8], 7);

    // OpenStreetMap 배경지도
    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap contributors'
      }
    ).addTo(map);


    // 물금읍 위치
    const mulgeum = L.marker([35.31, 129.01])
      .addTo(map)
      .bindPopup('<b>경상남도 양산시 물금읍</b>');


    // 대치4동 위치
    const daechi = L.marker([37.50, 127.06])
      .addTo(map)
      .bindPopup('<b>서울특별시 강남구 대치4동</b>');

  // --------------------------------------------------
  // 1. 기본 지도 생성
  // --------------------------------------------------
  map = L.map('map').setView([36.2, 127.8], 7);

  // OpenStreetMap 배경지도
  L.tileLayer(
    'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
    {
      maxZoom: 19,
      attribution: '&copy; OpenStreetMap contributors'
    }
  ).addTo(map);


  // --------------------------------------------------
  // 2. 시군구 경계 스타일
  //    강남구 / 양산시
  // --------------------------------------------------
  const sigunguStyle = {
    color: '#333333',
    weight: 3,
    fillColor: '#999999',
    fillOpacity: 0.08
  };


  // --------------------------------------------------
  // 3. 읍면동 경계 스타일
  //    대치4동 / 물금읍
  // --------------------------------------------------
  const dongStyle = {
    color: '#d62728',
    weight: 4,
    fillColor: '#d62728',
    fillOpacity: 0.12
  };


  // --------------------------------------------------
  // 4. 강남구 경계
  // --------------------------------------------------
  fetch('data/gangnam_boundary.geojson')
    .then(response => response.json())
    .then(data => {

      const gangnamLayer = L.geoJSON(data, {
        style: sigunguStyle
      }).addTo(map);

      gangnamLayer.bindPopup(
        '<b>서울특별시 강남구</b>'
      );

    })
    .catch(error => {
      console.error('강남구 GeoJSON 불러오기 오류:', error);
    });


  // --------------------------------------------------
  // 5. 양산시 경계
  // --------------------------------------------------
  fetch('data/yangsan_boundary.geojson')
    .then(response => response.json())
    .then(data => {

      const yangsanLayer = L.geoJSON(data, {
        style: sigunguStyle
      }).addTo(map);

      yangsanLayer.bindPopup(
        '<b>경상남도 양산시</b>'
      );

    })
    .catch(error => {
      console.error('양산시 GeoJSON 불러오기 오류:', error);
    });


  // --------------------------------------------------
  // 6. 대치4동 경계
  // --------------------------------------------------
  fetch('data/daechi4_boundary.geojson')
    .then(response => response.json())
    .then(data => {

      const daechiLayer = L.geoJSON(data, {
        style: dongStyle
      }).addTo(map);

      daechiLayer.bindPopup(
        '<b>서울특별시 강남구 대치4동</b>'
      );

    })
    .catch(error => {
      console.error('대치4동 GeoJSON 불러오기 오류:', error);
    });


  // --------------------------------------------------
  // 7. 물금읍 경계
  // --------------------------------------------------
  fetch('data/mulgeum_boundary.geojson')
    .then(response => response.json())
    .then(data => {

      const mulgeumLayer = L.geoJSON(data, {
        style: dongStyle
      }).addTo(map);

      mulgeumLayer.bindPopup(
        '<b>경상남도 양산시 물금읍</b>'
      );

    })
    .catch(error => {
      console.error('물금읍 GeoJSON 불러오기 오류:', error);
    });

</script>

</body>
</html>

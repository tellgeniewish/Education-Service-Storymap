<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>교육서비스업 공간분석 스토리맵</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <!-- Storymap CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="content">

    <h1>교육서비스업 공간분석 스토리맵</h1>

    <p>
      우리가 흔히 교육의 중심지라고 생각하는 서울 강남구 대치동.
      그런데 SGIS 데이터를 살펴보면 예상 밖의 지역이 등장합니다.
    </p>

    <p>
      경상남도 양산시 물금읍과 서울특별시 강남구 대치4동의
      교육서비스업과 공간적 특성을 비교해보겠습니다.
    </p>


    <h2>두 지역은 어디에 있을까?</h2>

    <p>
      먼저 물금읍과 대치4동의 위치를 지도에서 살펴보겠습니다.
      지도를 직접 확대하거나 이동할 수 있습니다.
    </p>

    <div id="map"></div>

    <h2>행정경계로 살펴보기</h2>

    <p>
      이번에는 강남구와 양산시의 경계를 먼저 확인하고,
      그 안에서 대치4동과 물금읍의 위치를 살펴보겠습니다.
    </p>

    <div id="boundary-map"></div>

  </div>

  <!-- Leaflet JavaScript -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Storymap JavaScript -->
  <script src="js/map.js"></script>

</body>
</html>
